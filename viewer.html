<body>

<div id="panorama"></div>

<script>
    // Get the image name from the URL
    const params = new URLSearchParams(window.location.search);
    const image = params.get("image") || "frame_00001.jpg";

    pannellum.viewer("panorama", {
        type: "equirectangular",
        panorama: "images/" + image,
        autoLoad: true,
        compass: false,
        showZoomCtrl: true
    });
</script>

</body>
</html>
