<body>

<div id="panorama"></div>

<script src="pannellum.js"></script>

<script>
    const params = new URLSearchParams(window.location.search);
    const image = params.get("image") || "frame_00001.jpg";

    pannellum.viewer("panorama", {
        type: "equirectangular",
        panorama: "images/" + image,
        autoLoad: true,
        showControls: true,
        compass: false
    });
</script>

</body>
</html>
